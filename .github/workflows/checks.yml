name: Check AAES
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python evals/score_routing.py --annotations evals/routing/independent-annotations.json
      - run: python -m unittest discover -s tests -v
      - run: python evals/run_controls.py
      - run: python scripts/test_installers.py --published
      - if: runner.os == 'Windows'
        name: Test Git Bash on Windows
        shell: pwsh
        run: python scripts/test_installers.py --shell (Join-Path $env:ProgramFiles 'Git/bin/bash.exe')
